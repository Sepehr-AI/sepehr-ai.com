worker_processes auto;

events {
    worker_connections 4096;
}

http {
    server {
        listen 80;
        listen [::]:80;
        server_name payment.sepehr-ai.com;

        # ACME HTTP-01 challenge
        location /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
        }

        # Redirect all plain HTTP to HTTPS
        location / {
            return 301 https://payment.sepehr-ai.com$request_uri;
        }
    }

    server {
        # HTTPS + HTTP/3
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        listen 443 quic reuseport;
        listen [::]:443 quic reuseport;

        http3 on;
        http2 on;

        server_name payment.sepehr-ai.com;

        # Let’s Encrypt cert paths
        ssl_certificate     /etc/letsencrypt/live/payment.sepehr-ai.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/payment.sepehr-ai.com/privkey.pem;

        ssl_session_timeout 1h;
        ssl_session_tickets off;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";

        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Only this route is proxied to the app on port 4040
        location =/verify {
            proxy_pass          http://127.0.0.1:4040;
            proxy_http_version  1.1;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
        }

        # Everything else -> main site
        location / {
            return 301 https://sepehr-ai.com;
        }
    }
}